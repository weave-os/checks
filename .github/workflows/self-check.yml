# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Self-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Dogfoods the reusable workflow from this pull request's own commit, the
  # same way consumers call it at a pinned SHA.
  self-check:
    uses: ./.github/workflows/weave-checks.yml
    permissions:
      id-token: write
    with:
      use-default-checks: true
    secrets:
      weave-router-key: ${{ secrets.WEAVE_ROUTER_KEY }}
      weave-api-key: ${{ secrets.WEAVE_API_KEY }}
