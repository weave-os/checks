# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Self-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: checks-self-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The action acts only as the Weave Checks App: the job's own token needs no
# write access. id-token lets the action prove to Weave which repository and
# workflow is asking before Weave issues an App installation token.
permissions:
  contents: read
  id-token: write

jobs:
  self-check:
    name: Weave Checks dogfood
    # Keep dogfooding disabled until the OIDC exchange endpoint is deployed
    # and verified; the App-only action intentionally has no bot fallback.
    # Fork PRs also receive no OIDC token. Never use pull_request_target.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.WEAVE_CHECKS_TOKEN_EXCHANGE_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      # This checkout makes the local composite action available as ./.
      # The action itself creates its aggregate before any optional consumer
      # checkout/preparation; credentials are not persisted in .git/config.
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # Secrets are optional until the repo owner has configured both in the
      # GitHub repository settings. Skip cleanly, with an explicit warning,
      # until then rather than failing every PR with missing credentials.
      - name: Check Router credentials are configured
        id: credentials
        shell: bash
        env:
          WEAVE_ROUTER_KEY: ${{ secrets.WEAVE_ROUTER_KEY }}
          WEAVE_API_KEY: ${{ secrets.WEAVE_API_KEY }}
        run: |
          if [ -n "${WEAVE_ROUTER_KEY}" ] && [ -n "${WEAVE_API_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Self-check skipped: configure repository secrets WEAVE_ROUTER_KEY and WEAVE_API_KEY to enable Router-backed dogfooding."
            printf "%s\n" "Weave Checks self-check skipped: configure both WEAVE_ROUTER_KEY and WEAVE_API_KEY repository secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Weave Checks
        if: steps.credentials.outputs.ready == 'true'
        uses: ./
        with:
          provider: weave-router
          weave-router-key: ${{ secrets.WEAVE_ROUTER_KEY }}
          weave-api-key: ${{ secrets.WEAVE_API_KEY }}
          checks-dir: starter-checks
          allowed-intelligence: low,medium,high,maximum
          checkout: false
          concurrency: "4"
          upload-diagnostics: "false"
